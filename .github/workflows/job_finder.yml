name: Job Finder Bot

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  find-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write         # needed to commit seen_jobs.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job finder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python job_finder.py

      - name: Save state back to repo
        run: |
          git config user.name "job-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_jobs.json jobs_latest.json source_health.json
          git diff --staged --quiet || git commit -m "chore: update job state [skip ci]"
          git push
